<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img" aria-label="An UPDATE keeps the old tuple and writes a new one" font-family="Instrument Sans, system-ui, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="236" fill="#fcfbf8"/>
  <defs>
    <marker id="upd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e6b63"/>
    </marker>
  </defs>
  <text x="24" y="40" font-size="15" font-weight="600" fill="#1c1c1a">An UPDATE keeps the old tuple and writes a new one</text>

  <rect x="40" y="76" width="264" height="88" rx="8" fill="none" stroke="#6e6b63" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="56" y="100" font-weight="600" fill="#1c1c1a">Old version at (0,1)</text>
  <text x="56" y="120" font-size="11.5" fill="#6e6b63">xmin 750 (inserted it)</text>
  <text x="56" y="136" font-size="11.5" fill="#1c1c1a">xmax 751 (expired it)</text>
  <text x="56" y="152" font-size="11.5" fill="#6e6b63">account1, balance 100</text>

  <path d="M304 120H456" fill="none" stroke="#6e6b63" stroke-width="1.25" marker-end="url(#upd-arrow)"/>
  <text x="380" y="110" text-anchor="middle" font-size="11.5" fill="#6e6b63">UPDATE in txn 751</text>

  <rect x="456" y="76" width="264" height="88" rx="8" fill="#eadbd2" stroke="#8b4a32" stroke-width="2"/>
  <text x="472" y="100" font-weight="600" fill="#1c1c1a">New version at (0,4)</text>
  <text x="472" y="120" font-size="11.5" fill="#1c1c1a">xmin 751 (inserted it)</text>
  <text x="472" y="136" font-size="11.5" fill="#6e6b63">xmax 0 (still live)</text>
  <text x="472" y="152" font-size="11.5" fill="#6e6b63">account1, balance 150</text>

  <text x="380" y="204" text-anchor="middle" font-size="11.5" fill="#6e6b63">Once 751 commits and no snapshot needs the old version, it is dead: VACUUM reclaims it</text>
</svg>
